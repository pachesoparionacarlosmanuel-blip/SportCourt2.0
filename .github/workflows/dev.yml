name: DEV - CI SportCourt

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-test-dev:
    runs-on: ubuntu-latest

    environment:
      name: DEV

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Ejecutar tests frontend
        run: npm test

      - name: Auditar dependencias frontend
        run: npm audit --audit-level=high

      - name: Compilar Tailwind CSS
        run: npm run build:css

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Ejecutar tests backend
        working-directory: backend
        run: ./mvnw test

      - name: Construir backend
        working-directory: backend
        run: ./mvnw package -DskipTests

  security-codeql:
    name: CodeQL - ${{ matrix.language }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compilar Java
        if: matrix.language == 'java'
        working-directory: backend
        run: ./mvnw -DskipTests package

      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  security-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Analizar dependencias Maven
        working-directory: backend
        run: ./mvnw org.owasp:dependency-check-maven:13.0.0:check -DfailBuildOnCVSS=8