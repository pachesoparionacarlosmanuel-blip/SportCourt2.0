name: DEV - CI SportCourt

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-test-dev:
    runs-on: ubuntu-latest

    environment:
      name: DEV

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Ejecutar tests frontend
        run: npm test

      - name: Auditar dependencias frontend
        run: npm audit --audit-level=high

      - name: Compilar Tailwind CSS
        run: npm run build:css

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Ejecutar tests backend
        working-directory: backend
        run: ./mvnw test

      - name: Construir backend
        working-directory: backend
        run: ./mvnw package -DskipTests

  security-codeql:
    name: CodeQL - ${{ matrix.language }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        if: matrix.language == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compilar Java
        if: matrix.language == 'java'
        working-directory: backend
        run: ./mvnw -DskipTests package

      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  security-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Obtener hora para clave de caché
        id: cache-key
        run: echo "datetime=$(date -u +'%Y%m%d%H')" >> "$GITHUB_OUTPUT"

      - name: Restaurar caché de Dependency-Check
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ steps.cache-key.outputs.datetime }}-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-${{ steps.cache-key.outputs.datetime }}-
            ${{ runner.os }}-dependency-check-

      - name: Analizar dependencias Maven
        id: dependency-check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw org.owasp:dependency-check-maven:12.2.2:check -DfailBuildOnCVSS=8 -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: Guardar caché de Dependency-Check
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ steps.cache-key.outputs.datetime }}-${{ hashFiles('backend/pom.xml') }}

  docker-trivy:
    name: Docker Build + Trivy
    runs-on: ubuntu-latest

    needs:
      - build-test-dev
      - security-codeql
      - security-dependency-check

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/pachesoparionacarlosmanuel-blip/sportcourt2.0:staging-${{ github.sha }}

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/pachesoparionacarlosmanuel-blip/sportcourt2.0:staging-${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'


  publish-ghcr:
    name: Publicar imagen en GHCR
    runs-on: ubuntu-latest

    needs:
      - docker-trivy

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar imagen validada por Trivy
        env:
          STAGING_IMAGE: ghcr.io/pachesoparionacarlosmanuel-blip/sportcourt2.0:staging-${{ github.sha }}
        run: |
          docker pull "$STAGING_IMAGE"

      - name: Etiquetar imagen validada
        env:
          STAGING_IMAGE: ghcr.io/pachesoparionacarlosmanuel-blip/sportcourt2.0:staging-${{ github.sha }}
          SHA_IMAGE: ghcr.io/pachesoparionacarlosmanuel-blip/sportcourt2.0:${{ github.sha }}
          LATEST_IMAGE: ghcr.io/pachesoparionacarlosmanuel-blip/sportcourt2.0:latest
        run: |
          docker tag "$STAGING_IMAGE" "$SHA_IMAGE"
          docker tag "$STAGING_IMAGE" "$LATEST_IMAGE"

      - name: Publicar imagen validada
        env:
          SHA_IMAGE: ghcr.io/pachesoparionacarlosmanuel-blip/sportcourt2.0:${{ github.sha }}
          LATEST_IMAGE: ghcr.io/pachesoparionacarlosmanuel-blip/sportcourt2.0:latest
        run: |
          docker push "$SHA_IMAGE"
          docker push "$LATEST_IMAGE"

      - name: Confirmar promoción de imagen
        env:
          STAGING_IMAGE: ghcr.io/pachesoparionacarlosmanuel-blip/sportcourt2.0:staging-${{ github.sha }}
        run: |
          echo "La imagen validada fue promovida desde:"
          echo "$STAGING_IMAGE"


  validate-test:
    name: Validar Railway TEST
    runs-on: ubuntu-latest
    needs:
      - publish-ghcr

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Esperar despliegue de Railway TEST
        run: |
          echo "Esperando a que Railway TEST despliegue la nueva imagen..."

          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://stunning-truth-ghcr-test.up.railway.app/api/canchas)

            echo "Intento $i/30 - HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Railway TEST está respondiendo correctamente."
              exit 0
            fi

            sleep 10
          done

          echo "Railway TEST no respondió como se esperaba."
          exit 1


  deploy-prod:
    name: Promover imagen a PROD
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
    needs:
      - validate-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: PROD

    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - name: Mostrar imagen a promover
        run: |
          echo "Imagen:"
          echo "ghcr.io/pachesoparionacarlosmanuel-blip/sportcourt2.0:${{ github.sha }}"

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar imagen en GHCR
        env:
          IMAGE: ghcr.io/pachesoparionacarlosmanuel-blip/sportcourt2.0:${{ github.sha }}
        run: |
          docker manifest inspect "$IMAGE" > /dev/null
          echo "Imagen SHA disponible en GHCR."

      - name: Configurar Railway CLI
        run: |
          npm install -g @railway/cli@5.62.1

      - name: Promover imagen SHA a PROD
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          IMAGE: ghcr.io/pachesoparionacarlosmanuel-blip/sportcourt2.0:${{ github.sha }}
        run: |
          railway service source connect \
            --image "$IMAGE" \
            --service stunning-truth \
            --environment PROD \
            --project fce9e8e7-4284-49c6-8111-3761461d1cfd \

      - name: Verificar PROD
        run: |
          echo "Esperando respuesta de PROD..."

          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://stunning-truth-production-0b63.up.railway.app/api/canchas)

            echo "Intento $i/30 - HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "PROD está respondiendo correctamente."
              exit 0
            fi

            sleep 10
          done

          echo "PROD no respondió correctamente."
          exit 1