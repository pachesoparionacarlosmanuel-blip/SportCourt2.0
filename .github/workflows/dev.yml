name: DEV - CI SportCourt

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-test-dev:
    runs-on: ubuntu-latest

    environment:
      name: DEV

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Ejecutar tests frontend
        run: npm test

      - name: Auditar dependencias frontend
        run: npm audit --audit-level=high

      - name: Compilar Tailwind CSS
        run: npm run build:css

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Ejecutar tests backend
        working-directory: backend
        run: ./mvnw test

      - name: Construir backend
        working-directory: backend
        run: ./mvnw package -DskipTests

  security-codeql:
    name: CodeQL - ${{ matrix.language }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        if: matrix.language == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compilar Java
        if: matrix.language == 'java'
        working-directory: backend
        run: ./mvnw -DskipTests package

      - name: Analizar con CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  security-dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Analizar dependencias Maven
        working-directory: backend
        env:
           NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw org.owasp:dependency-check-maven:12.2.2:check -DfailBuildOnCVSS=8 -DnvdApiKeyEnvironmentVariable=NVD_API_KEY


  docker-trivy:
    name: Docker Build + Trivy
    runs-on: ubuntu-latest
    needs:
      - build-test-dev
      - security-codeql
      - security-dependency-check

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen Docker
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          push: false
          tags: sportcourt2.0:${{ github.sha }}

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sportcourt2.0:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'


  publish-ghcr:
    name: Publicar imagen en GHCR
    runs-on: ubuntu-latest
    needs:
      - docker-trivy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/pachesoparionacarlosmanuel-blip/sportcourt2.0:${{ github.sha }}
            ghcr.io/pachesoparionacarlosmanuel-blip/sportcourt2.0:latest