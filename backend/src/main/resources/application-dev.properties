spring.application.name=backend

# Configuración de Desarrollo
# Usar con: mvn spring-boot:run -Dspring-boot.run.arguments="--spring.profiles.active=dev"

# Base de Datos - Local
spring.datasource.url=jdbc:mysql://localhost:3306/sportcourt
spring.datasource.username=sportcourt
spring.datasource.password=SportCourt123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - Mostrar SQL en desarrollo
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# Security - Usuario admin de desarrollo
spring.security.user.name=admin
spring.security.user.password=admin123
