spring.application.name=backend

# Base de Datos - Usar variables de entorno para seguridad
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sportcourt}
spring.datasource.username=${DB_USERNAME:sportcourt}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA - Configuración segura para producción
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security
server.port=${SERVER_PORT:8080}
spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASSWORD:changeme}